            deliverable: "AGENTS.md, CHANGELOG.md"
            reference: "~/code/game-spice/AGENTS.md"
            tdd: true

          - title: "Prepare marketplace entry"
            priority: 3
            depends_on: ["Create AGENTS.md and CHANGELOG.md"]
            tracer: "Distribution — proves plugin is discoverable in Line Cook marketplace"
            description: |
